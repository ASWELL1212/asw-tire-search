<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#164e63">
  <title>ASW Tire Manager</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section id="loginView" class="auth-view">
      <div class="auth-card">
        <div class="brand">AS WELL</div>
        <h1>ASW Tire Manager</h1>
        <p class="sub">タイヤ保管・交換管理</p>
        <form id="loginForm">
          <label>メールアドレス
            <input id="email" type="email" autocomplete="username" required>
          </label>
          <label>パスワード
            <input id="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary" type="submit">ログイン</button>
        </form>
        <div id="loginMessage" class="message"></div>
      </div>
    </section>

    <section id="appView" class="hidden">
      <header class="topbar">
        <div>
          <div class="brand">AS WELL</div>
          <h1>タイヤ管理</h1>
        </div>
        <button id="logoutBtn" class="ghost">ログアウト</button>
      </header>

      <section id="setupCard" class="setup-card hidden">
        <h2>初期データ登録</h2>
        <p>Excelから取り込んだ142台の保管データをFirestoreへ登録します。最初の1回だけ実行してください。</p>
        <button id="seedBtn" class="primary">初期データを登録</button>
        <div id="seedMessage" class="message"></div>
      </section>

      <section class="dashboard">
        <button class="stat active" data-filter="all">
          <span>全車両</span><strong id="countAll">0</strong>
        </button>
        <button class="stat" data-filter="studless">
          <span>スタッドレス</span><strong id="countStudless">0</strong>
        </button>
        <button class="stat" data-filter="normal">
          <span>ノーマル</span><strong id="countNormal">0</strong>
        </button>
        <button class="stat" data-filter="unset">
          <span>未設定</span><strong id="countUnset">0</strong>
        </button>
      </section>

      <section class="quick-actions">
        <button id="newVehicleBtn" class="quick-action">＋ 新規預かり登録</button>
        <button id="showActiveBtn" class="quick-action active">保管中</button>
        <button id="showOutboundBtn" class="quick-action">出庫済み</button>
      </section>

      <section class="vacancy-actions"><button id="vacancyListBtn" class="vacancy-action">空き場所一覧</button></section>

      <section class="season-actions">
        <button id="winterPendingBtn" class="season-action winter">
          <span>冬タイヤ未交換</span>
          <strong id="countWinterPending">0</strong>
        </button>
        <button id="summerPendingBtn" class="season-action summer">
          <span>夏タイヤ未交換</span>
          <strong id="countSummerPending">0</strong>
        </button>
        <button id="contactedBtn" class="season-action contacted">
          <span>連絡済みのみ</span>
          <strong id="countContacted">0</strong>
        </button>
      </section>

      <section class="search-card">
        <label for="query">名前または車両番号</label>
        <div class="input-row">
          <input id="query" type="search" placeholder="例：安藤 / 1516" autocomplete="off">
          <button id="clearBtn" class="clear" type="button">×</button>
        </div>
        <div class="chips">
          <button class="chip" data-filter="lease">リース車</button>
          <button class="chip" data-filter="mato">まとメンテ</button>
        </div>
      </section>

      <section id="loading" class="panel">読み込み中…</section>
      <section id="empty" class="panel hidden">該当する車両がありません</section>
      <section id="list" class="vehicle-list hidden"></section>

      <footer>ASW Tire Manager Ver.3.0</footer>
    </section>
  </main>

  <dialog id="vacancyDialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="閉じる">×</button>
      <div class="detail-title">空き場所一覧</div>
      <div class="vacancy-summary" id="vacancySummary"></div>
      <div class="vacancy-list" id="vacancyList"></div>
    </form>
  </dialog>

  <dialog id="registerDialog">
    <form id="registerForm" class="dialog-card">
      <button type="button" class="dialog-close" id="registerCloseBtn" aria-label="閉じる">×</button>
      <div class="detail-title">新規預かり登録</div>
      <label>顧客名<input id="regName" required></label>
      <label>車種<input id="regVehicle" required></label>
      <label>車両番号<input id="regNumber" required></label>
      <div class="form-grid">
        <label>列<input id="regColumn" type="number" min="1" max="99" required></label>
        <label>番<input id="regPosition" type="number" min="1" max="999" required></label>
      </div>
      <button type="button" id="suggestPlaceBtn" class="action">空き場所を自動提案</button>
      <div class="switch-row">
        <button type="button" id="regLeaseBtn" class="action">リース車</button>
        <button type="button" id="regMatoBtn" class="action">まとメンテ</button>
      </div>
      <button type="submit" class="primary">登録する</button>
      <div id="registerMessage" class="message"></div>
    </form>
  </dialog>

  <dialog id="detailDialog">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="閉じる">×</button>
      <div id="detailBody"></div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
